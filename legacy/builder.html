<!-- ================= APP SHELL (ManagR) ================= -->
<div class="appshell" id="appShell">
  <div class="scrim" id="scrim"></div>
  <aside class="side" id="sideNav"></aside>
  <div class="app__main">
    <header class="topbar">
      <button class="btn btn-ico btn-sm menu" id="menuBtn" aria-label="Menu"><svg class="icon"><use href="#i-layout"/></svg></button>
      <h1 id="topTitle">Website</h1>
    </header>
    <div id="screen"></div>
  </div>
</div>

<!-- ================= EDITOR ================= -->
<div class="editor" id="editor">
  <div class="etop" id="etop"></div>
  <div class="mtop" id="mtop"></div>
  <div class="ebody">
    <div class="erail" id="erail"></div>
    <div class="epanel left" id="eLeft"></div>
    <div class="ecanvas" id="eCanvas"></div>
    <div class="epanel right" id="eRight"></div>
  </div>
  <div class="mfloat hide" id="mfloat"></div>
  <div class="mbar" id="mbar"></div>
  <div class="estatus" id="estatus"></div>
  <div class="epanelov" id="ePanelOv" hidden></div>
</div>

<!-- ================= VISITOR SITE ================= -->
<div class="vshell" id="vshell">
  <div class="vbar" id="vbar"></div>
  <div class="vscroll" id="vscroll"></div>
</div>

<!-- overlays -->
<div class="ov" id="ov"></div>
<div class="cmd" id="cmd">
  <div class="cmd-box">
    <input id="cmdInput" placeholder="Type a command… (add section, theme, availability, preview, publish)" autocomplete="off">
    <div class="cmd-list" id="cmdList"></div>
  </div>
</div>
<div id="coachRoot"></div>
<div class="toasts" id="toasts"></div>

<!-- ================= DEV BAR ================= -->
<div class="dev" id="dev">
  <button class="dev-tog" id="devTog" aria-label="Prototype controls"><svg class="icon"><use href="#i-flask"/></svg></button>
  <div class="dev-panel">
    <h5>Jump to</h5>
    <div class="dev-jump" id="devJump"></div>
    <div id="devToggles"></div>
    <button class="dev-reset" id="devReset">Reset prototype</button>
    <p class="dev-note">Prototype scaffolding — simulates the ManagR data, plan and role the builder reads. Not part of the product.</p>
  </div>
</div>

<script src="assets/js/builder.js"></script>
</body>
</html>
